name: Simple Workflow Demo

# Trigger: Run this workflow every time code is pushed to the main branch
on:
  push:
    branches:
      - main

jobs:
  Hello-Job:
    # Environment: Runs on GitHub's cloud-hosted Linux machine
    runs-on: self-hosted

    steps:
      - name: Print a greeting
        run: echo "Hello, world! Your GitHub Action is working perfectly."

      - name: Check system details
        run: |
          echo "Current runner OS:"
          uname -a
          echo "Current directory contents:"
          ls -la

